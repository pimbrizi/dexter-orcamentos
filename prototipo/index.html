<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2E3440">
<title>Dexter Orçamentos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400..800&display=swap" rel="stylesheet">
<style>
/* Tokens: Nord (Polar Night, Snow Storm, Frost, Aurora) ----------------- */
:root{
  /* Snow Storm: variante clara, lê melhor no sol */
  color-scheme:light;
  --l:24px; /* uma linha da grade de texto */
  --bg:#ECEFF4; --surface-2:#E5E9F0; --raised:#E5E9F0; --sel:#C9D1DD;
  --ink:#2E3440; --ink-2:#3B4252; --ink-3:#5A6680;
  --line:#AEB8C8; --line-soft:#C9D1DD;
  --primary:#2E3440; --primary-press:#3B4252; --on-primary:#ECEFF4;
  --link:#4C6E99; --focus:#5E81AC;
  --panel:#2E3440; --panel-deep:#242933;
  --led:#88C0D0; --led-off:rgba(136,192,208,.09);
  --amber:#8A6514; --frost:#2F6F82; --sent:#4C6E99; --green:#46722F; --red:#A13D47; --gray:#5A6680; --on-status:#ECEFF4;
  --scrim:rgba(46,52,64,.55);
  --rail:264px;
  --mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    /* Polar Night */
    color-scheme:dark;
    --bg:#2E3440; --surface-2:#3B4252; --raised:#3B4252; --sel:#4C566A;
    --ink:#ECEFF4; --ink-2:#D8DEE9; --ink-3:#96A2B6;
    --line:#4C566A; --line-soft:#3B4252;
    --primary:#88C0D0; --primary-press:#8FBCBB; --on-primary:#2E3440;
    --link:#88C0D0; --focus:#88C0D0;
    --panel:#242933; --panel-deep:#1E222A;
    --amber:#EBCB8B; --frost:#88C0D0; --sent:#81A1C1; --green:#A3BE8C; --red:#E0868F; --gray:#A3AEC0; --on-status:#2E3440;
    --scrim:rgba(20,23,29,.72);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#2E3440; --surface-2:#3B4252; --raised:#3B4252; --sel:#4C566A;
  --ink:#ECEFF4; --ink-2:#D8DEE9; --ink-3:#96A2B6;
  --line:#4C566A; --line-soft:#3B4252;
  --primary:#88C0D0; --primary-press:#8FBCBB; --on-primary:#2E3440;
  --link:#88C0D0; --focus:#88C0D0;
  --panel:#242933; --panel-deep:#1E222A;
  --amber:#EBCB8B; --frost:#88C0D0; --sent:#81A1C1; --green:#A3BE8C; --red:#E0868F; --gray:#A3AEC0; --on-status:#2E3440;
  --scrim:rgba(20,23,29,.72);
}

/* Base: um tamanho de fonte, grade de linhas ---------------------------- */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--mono);font-size:15px;line-height:var(--l);font-variant-ligatures:none;-webkit-font-smoothing:antialiased}
body.locked{overflow:hidden}
::selection{background:var(--primary);color:var(--on-primary)}
h1,h2,h3{margin:0;font-size:inherit;line-height:inherit;font-weight:800}
p{margin:0 0 calc(var(--l) / 2)}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit;line-height:inherit}
input,select,textarea{caret-color:var(--link)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.ic{flex:none;display:block}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.faint{color:var(--ink-3)}
.strong{font-weight:700}
.center{text-align:center}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.trunc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.warn{color:var(--amber)}
.key{font-weight:400;opacity:.75}

/* Layout ---------------------------------------------------------------- */
.strip{display:flex;align-items:stretch;min-height:32px;margin:0;padding:0 0 0 16px;background:var(--surface-2);color:var(--ink-3)}
.strip-t{flex:1;min-width:0;align-self:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip-b{flex:none;display:flex;align-items:center;gap:.6ch;padding:0 1.5ch;border:0;background:none;color:var(--ink-2);font-weight:700;text-decoration:none;cursor:pointer}
.strip-b:hover{background:var(--sel);color:var(--ink)}
.strip-b .k{color:var(--link)}
.screen{width:100%;max-width:600px;margin:0 auto;padding:0 16px calc(var(--l) * 6)}
.top{display:flex;align-items:flex-start;gap:1.5ch;padding:var(--l) 0}
.top h1{flex:1;min-width:0;padding-top:10px}
.top h1::before{content:"# ";color:var(--link)}
.top .sub{display:block;font-weight:400;color:var(--ink-3)}
.iconbtn{width:44px;height:44px;flex:none;border:0;background:var(--surface-2);display:grid;place-items:center;cursor:pointer;color:var(--ink);text-decoration:none}
.iconbtn:hover{background:var(--sel)}
.sec{margin-top:calc(var(--l) * 1.5)}
.top + .sec{margin-top:0}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:2ch;margin:0 0 calc(var(--l) / 2)}
.sec-h p{margin:0;color:var(--ink-3)}
.sec-h h2::before{content:"## ";color:var(--link)}
/* Título embutido na borda do painel */
.sec-h:is(:has(+ .group),:has(+ .fields),:has(+ .box)){position:relative;z-index:1;align-items:center;height:var(--l);margin:0 1ch calc(var(--l) / -2)}
.sec-h:is(:has(+ .group),:has(+ .fields),:has(+ .box)) > *{padding:0 1ch;background:var(--bg);white-space:nowrap}
.sec-h:is(:has(+ .group),:has(+ .fields),:has(+ .box)) h2{flex:none}
.sec-h:is(:has(+ .group),:has(+ .fields),:has(+ .box)) h2::before{content:none}
.sec-h:is(:has(+ .group),:has(+ .fields),:has(+ .box)) p{min-width:0;overflow:hidden;text-overflow:ellipsis}

/* Painéis */
.group{border:1px solid var(--line)}
.box{padding:var(--l) 2ch calc(var(--l) / 2);border:1px solid var(--line)}
.box p{margin:0}
.box .gap{margin-top:calc(var(--l) / 2)}
.fields{padding:var(--l) 2ch 0;border:1px solid var(--line)}
.row{display:flex;align-items:center;gap:2ch;width:100%;min-height:calc(var(--l) * 2.5);padding:calc(var(--l) / 2) 2ch;border:0;border-top:1px solid var(--line-soft);background:none;text-align:left;text-decoration:none;color:inherit}
.group > :first-child{border-top:0;padding-top:calc(var(--l) * .75)}
a.row,button.row{cursor:pointer}
a.row:hover,button.row:hover{background:var(--surface-2)}
.row .main{flex:1;min-width:0}
.row .t{display:block;font-weight:700}
.row .s{display:block;color:var(--ink-2)}
.row .s.faint{color:var(--ink-3)}
.row .end{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:4px;text-align:right}
.row.total{background:var(--surface-2)}
.row.is-old .t,.row.is-old .end{color:var(--ink-3)}
.row .ic{color:var(--ink-3)}
.empty-line{margin:0;padding:calc(var(--l) / 2) 0;color:var(--ink-2)}
.empty{padding:var(--l) 0}

/* Cartões: texto embutido nas bordas de cima e de baixo */
.cards{display:grid;grid-template-columns:minmax(0,1fr);gap:calc(var(--l) * 1.5);padding-top:calc(var(--l) / 2)}
.card{position:relative;display:block;width:100%;padding:calc(var(--l) / 2) 2ch;border:1px solid var(--line);background:none;text-align:left;color:inherit;text-decoration:none}
a.card,button.card{cursor:pointer}
a.card:hover,button.card:hover{border-color:var(--ink-3)}
a.card:hover .card-top > :first-child,button.card:hover .card-top > :first-child{color:var(--link)}
.card-top,.card-bot{display:flex;align-items:center;justify-content:space-between;gap:1ch;height:var(--l);white-space:nowrap}
.card-top{margin:calc(var(--l) * -1) -1ch 0}
.card-bot{margin:0 -1ch calc(var(--l) * -1)}
.card-top > *,.card-bot > *{min-width:0;padding:0 1ch;background:var(--bg)}
.card-top > :first-child{overflow:hidden;text-overflow:ellipsis;font-weight:800}
.card-top > :last-child{flex:none;font-weight:700}
.card-top > .faint{font-weight:400}
.card-bot > :last-child:not(.chip){overflow:hidden;text-overflow:ellipsis}
.card-body{display:block;padding:calc(var(--l) / 2) 0;color:var(--ink-2)}
.card-acts{display:flex;justify-content:flex-end;gap:1ch;padding:0 0 calc(var(--l) / 2)}

/* Etiquetas: bloco sólido */
.chip{display:inline-block;padding:0 1ch;background:var(--st,var(--sel));color:var(--on-status);font-weight:700;white-space:nowrap}
.chip.neutral{--st:var(--sel);color:var(--ink)}
.card-bot > .chip{background:var(--st,var(--sel))}
.st-aguardando{--st:var(--amber)}
.st-pronto{--st:var(--frost)}
.st-enviado{--st:var(--sent)}
.st-vencido{--st:var(--gray)}
.st-aprovado{--st:var(--green)}
.st-recusado{--st:var(--red)}

/* Pontilhado de chave e valor */
.kv{display:flex;align-items:baseline;gap:1ch;padding:calc(var(--l) / 6) 0;color:inherit;text-decoration:none}
.kv .k{min-width:0}
.kv .dots{flex:1;min-width:2ch;height:0;border-bottom:2px dotted var(--line);transform:translateY(-.3em)}
.kv .v{flex:none;font-weight:700;text-align:right}
a.kv:hover .k{color:var(--link)}
.kv-sub{margin:0 0 calc(var(--l) / 3);color:var(--ink-3)}
.cards + .kv.total{margin-top:var(--l)}

/* Tracejado = provisório / só no protótipo */
.note{padding:calc(var(--l) / 2) 2ch;border:1px dashed var(--ink-3);color:var(--ink-2)}
.note p{margin:0}
.info{margin:0;padding:calc(var(--l) / 2) 2ch;background:var(--surface-2);color:var(--ink-2)}

/* Botões: blocos, o principal em vídeo inverso */
.btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:1ch;min-height:calc(var(--l) * 2);padding:0 2ch;border:0;font-weight:700;text-decoration:none;cursor:pointer}
.btn-primary{background:var(--primary);color:var(--on-primary)}
.btn-primary:hover{background:var(--primary-press)}
.btn-wa{background:var(--green);color:var(--on-status)}
.btn-wa:hover{filter:brightness(1.08)}
.btn-ghost{background:var(--surface-2);box-shadow:inset 0 -1px 0 var(--line);color:var(--ink)}
.btn-ghost:hover{background:var(--sel)}
.btn-sm{min-height:calc(var(--l) * 1.5);padding:0 1ch}
.btn-block{width:100%}
.link{position:relative;padding:0;border:0;background:none;color:var(--link);font-weight:700;cursor:pointer}
.link::after{content:"";position:absolute;inset:-10px -6px}

/* Barras de menu */
.filters,.menubar{display:flex;width:max-content;max-width:100%;overflow-x:auto;background:var(--surface-2);scrollbar-width:none}
.filters{margin:0 0 var(--l)}
.filter,.menubar button{flex:none;padding:0 1.5ch;border:0;background:none;line-height:calc(var(--l) * 1.5);color:var(--ink-2);text-decoration:none;white-space:nowrap;cursor:pointer}
.filter:hover,.menubar button:hover{color:var(--ink)}
.filter[aria-current],.menubar button[aria-pressed="true"]{background:var(--sel);color:var(--ink);font-weight:700}

/* Formulários */
.field{display:grid;gap:4px;margin:0 0 var(--l)}
fieldset.field{border:0;padding:0;min-width:0}
.field label,.field legend,.lbl{padding:0;color:var(--ink-3)}
.field legend{margin-bottom:4px}
.field .xs{margin:0}
.input{width:100%;min-height:calc(var(--l) * 2);padding:0 1ch;border:0;border-bottom:1px solid var(--line);border-radius:0;background:var(--surface-2);font-size:16px;color:var(--ink)}
textarea.input{min-height:calc(var(--l) * 4);padding:8px 1ch;resize:vertical}
.input[aria-invalid="true"]{border-bottom:2px solid var(--red)}
.err{margin:0;color:var(--red)}
.err:empty{display:none}
.affix,.search{display:flex;align-items:center;min-height:calc(var(--l) * 2);border-bottom:1px solid var(--line);background:var(--surface-2)}
.affix:focus-within,.search:focus-within{outline:2px solid var(--focus);outline-offset:2px}
.affix input,.search input{flex:1;min-width:0;height:calc(var(--l) * 2 - 1px);padding:0 1ch;border:0;background:none;font-size:16px;color:var(--ink);outline:none}
.affix span{padding:0 1ch;color:var(--ink-3)}
.affix span:first-child{padding-right:0}
.affix span:last-child{padding-left:0}
.search{margin:0 0 calc(var(--l) / 2);padding-left:1ch;color:var(--ink-3)}
.choices{display:flex;flex-wrap:wrap;gap:4px}
.choice,.choice-r span{display:inline-flex;align-items:center;min-height:calc(var(--l) * 1.75);padding:0 1.5ch;border:0;background:var(--surface-2);font-weight:600;cursor:pointer}
.choice:hover,.choice-r span:hover{background:var(--sel)}
.choice[aria-pressed="true"],.choice-r input:checked + span{background:var(--primary);color:var(--on-primary)}
.choice-r{position:relative}
.choice-r input{position:absolute;inset:0;margin:0;opacity:0;cursor:pointer}
.choice-r input:focus-visible + span{outline:2px solid var(--focus);outline-offset:2px}
.stepper{display:inline-flex;align-items:center;justify-self:start;background:var(--surface-2)}
.stepper button{width:44px;height:44px;border:0;background:none;display:grid;place-items:center;cursor:pointer}
.stepper button:hover{background:var(--sel)}
.stepper output{min-width:7ch;text-align:center;font-weight:700}
.row .stepper button{width:40px;height:40px}
.row .stepper output{min-width:4ch}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:1ch;margin:0 0 var(--l)}
.steps i{height:4px;background:var(--sel)}
.steps i.on{background:var(--link)}
.results{margin-bottom:calc(var(--l) / 2)}
.hint{margin:calc(var(--l) / 2) 0 0}

/* O display de 7 segmentos ---------------------------------------------- */
.display{padding:calc(var(--l) / 2) 2ch;border:1px solid var(--line);background:var(--panel);color:#D8DEE9}
.d-lbl{font-weight:700}
.readout{display:flex;align-items:flex-end;gap:1ch;min-height:52px;margin:8px 0}
.readout .cur{padding-bottom:2px;font-weight:800;color:var(--led)}
.seg{display:block;height:52px;width:auto;max-width:calc(100% - 44px);overflow:visible;filter:drop-shadow(0 0 4px rgba(136,192,208,.45))}
.s-on{fill:var(--led)}
.s-off{fill:var(--led-off)}
.d-sub{margin:0}
.display.boot .s-on{animation:boot .8s linear}
@keyframes boot{0%{opacity:.1}18%{opacity:1}32%{opacity:.2}50%{opacity:1}64%{opacity:.55}100%{opacity:1}}

/* Detalhe */
.calc-d{margin-top:calc(var(--l) * 1.5);border:1px solid var(--line)}
.calc-d summary{display:flex;justify-content:space-between;align-items:center;padding:calc(var(--l) / 2) 2ch;font-weight:700;cursor:pointer;list-style:none}
.calc-d summary::-webkit-details-marker{display:none}
.calc-d summary::after{content:"[+]";color:var(--link)}
.calc-d[open] summary::after{content:"[−]"}
.calc-in{padding:0 2ch calc(var(--l) / 2)}
.calc{width:100%;margin:0 0 calc(var(--l) / 2);border-collapse:collapse}
.calc th{text-align:left;font-weight:400;color:var(--ink-3)}
.calc td{padding:4px 0;border-top:1px dashed var(--line);vertical-align:top}
.calc th:not(:first-child),.calc td:not(:first-child){padding-left:1ch;text-align:right;white-space:nowrap}
.calc td span{display:block;color:var(--ink-3)}
.msg{margin:0 0 calc(var(--l) / 2);padding:calc(var(--l) / 2) 2ch;border-left:2px solid var(--line);background:var(--surface-2);font:inherit;white-space:pre-wrap;word-break:break-word}
.preview{margin:0 0 var(--l);color:var(--ink-2)}

/* Admin */
.avatar{width:4ch;height:4ch;flex:none;display:grid;place-items:center;background:var(--surface-2);font-weight:700;color:var(--ink-2)}
.role{color:var(--ink-3)}
.seg-row{display:grid;grid-template-columns:minmax(0,1fr) 12ch;align-items:center;gap:2ch;margin-bottom:calc(var(--l) / 2)}
.seg-row .lbl{color:var(--ink)}
.sim-in{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:2ch}
.sim .display{margin:0 0 calc(var(--l) / 2)}

/* Barras de baixo */
.actions{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:8px 16px calc(8px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--bg)}
.actions .in{display:flex;gap:1ch;max-width:600px;margin:0 auto}
.actions .btn{flex:1}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);padding:0 0 env(safe-area-inset-bottom);border-top:1px solid var(--line);background:var(--raised)}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:56px;font-size:12px;line-height:16px;color:var(--ink-3);text-decoration:none}
.tab[aria-current="page"]{background:var(--sel);color:var(--ink);font-weight:700}
.tab .badge{position:absolute;top:5px;left:calc(50% + 6px);min-width:16px;height:16px;padding:0 3px;background:var(--amber);color:var(--on-status);font-size:11px;line-height:16px;font-weight:800;text-align:center}
.tab-new{justify-self:center;align-self:center;display:grid;place-items:center;width:52px;height:44px;background:var(--primary);color:var(--on-primary);text-decoration:none}
.tab-new .lbl-new{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.rail-brand,.rail-sep{display:none}
@media (max-width:899px){.tabbar.hide-m{display:none}}

/* Janela, fundo e aviso */
.scrim{position:fixed;inset:0;z-index:40;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:90dvh;overflow:auto;padding:calc(var(--l) / 2) 16px calc(var(--l) + env(safe-area-inset-bottom));border-top:2px solid var(--link);background:var(--bg);transform:translateY(105%);visibility:hidden;transition:transform .22s ease,visibility 0s linear .22s}
.sheet.open{transform:none;visibility:visible;transition:transform .22s ease}
.sheet-head{position:relative;display:flex;justify-content:flex-end;min-height:4px}
.grab{display:none}
.sheet-x{position:absolute;top:-4px;right:-4px;margin:0}
.sheet h2{margin:6px 56px calc(var(--l) / 2) 0}
.sheet h2::before{content:"# ";color:var(--link)}
.sheet h2:focus{outline:none}
.toast{position:fixed;left:16px;right:16px;top:calc(10px + env(safe-area-inset-top));z-index:60;max-width:520px;margin:0 auto;padding:calc(var(--l) / 2) 2ch;background:var(--ink);color:var(--bg);font-weight:600;opacity:0;transform:translateY(-8px);transition:opacity .2s,transform .2s;pointer-events:none}
.toast.show{opacity:1;transform:none}

/* Login */
.login{min-height:100dvh}
.login-card{max-width:480px;min-height:100dvh;margin:0 auto}
.login-hero{padding:var(--l) 16px;background:var(--panel);color:#D8DEE9}
.login-hero .display{margin:var(--l) 0 calc(var(--l) / 2);border-color:#434C5E;background:var(--panel-deep)}
.login-hero .seg{height:58px}
.login-hero .xs{margin:0}
.login-body{padding:var(--l) 16px calc(var(--l) * 2)}
.login-body h1{margin-bottom:calc(var(--l) / 2)}
.login-body h1::before{content:"# ";color:var(--link)}
.demo{margin-top:var(--l)}
.demo-btns{display:flex;gap:1ch;margin-top:calc(var(--l) / 2)}
.wordmark{font-weight:800}
.wordmark small{display:block;font-size:inherit;font-weight:400;opacity:.75}
.login-hero .wordmark{color:#ECEFF4}
@media (min-width:600px){
  .login{display:grid;place-items:center;padding:32px 16px}
  .login-card{width:100%;min-height:0;border:1px solid var(--line)}
}

/* Desktop: barra lateral como num TUI ----------------------------------- */
@media (min-width:900px){
  .tabbar{top:0;right:auto;width:var(--rail);display:flex;flex-direction:column;align-items:stretch;padding:var(--l) 2ch;border-top:0;border-right:1px solid var(--line);background:var(--bg)}
  .rail-brand{display:block;order:-2;padding:0 0 var(--l)}
  .rail-brand .wordmark{color:var(--ink)}
  .rail-sep{display:block;height:0;margin:calc(var(--l) / 2) 0;border:0;border-top:2px solid var(--line)}
  .tab{flex-direction:row;justify-content:flex-start;gap:1.5ch;min-height:calc(var(--l) * 1.5);padding:0 1ch;font-size:inherit;line-height:inherit;color:var(--ink-2)}
  .tab:hover{background:var(--surface-2);color:var(--ink)}
  .tab .ic{width:16px;height:16px}
  .tab .badge{position:static;margin-left:auto}
  .tab-new{order:-1;align-self:stretch;display:flex;gap:1ch;justify-content:center;width:auto;height:calc(var(--l) * 1.5);margin:0 0 var(--l);font-weight:700}
  .tab-new .ic{width:16px;height:16px}

<script>
(() => {
'use strict';

/* Utilidades ------------------------------------------------------------ */
const KEY = 'dexter-prototipo-v1';
const M = 6e4, H = 36e5, D = 864e5;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl = c => (c / 100).toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
const dec = c => (c / 100).toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
const segVal = c => (c / 100).toFixed(2).replace('.', ',');
const fmtN = n => Number(n).toLocaleString('pt-BR', {maximumFractionDigits:2});
const pad = n => String(n).padStart(4, '0');
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const norm = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
const num = v => { const n = parseFloat(String(v).replace(',', '.')); return Number.isFinite(n) ? n : 0; };
const parseNum = v => { const n = parseFloat(String(v).trim().replace(',', '.')); return Number.isFinite(n) ? n : NaN; };
const parseMoney = s => {
  let t = String(s).replace(/[^\d,.-]/g, '');
  if (t.includes(',')) t = t.replace(/\./g, '').replace(',', '.');
  else if (/\.\d{3}$/.test(t)) t = t.replace(/\./g, '');
  const n = parseFloat(t);
  return Number.isFinite(n) ? Math.round(n * 100) : NaN;
};
const rel = ts => {
  const d = Date.now() - ts;
  if (d < M) return 'agora';
  if (d < H) return `há ${Math.round(d / M)} min`;
  if (d < D) return `há ${Math.round(d / H)} h`;
  const n = Math.floor(d / D);
  return n === 1 ? 'há 1 dia' : `há ${n} dias`;
};
const fdate = ts => new Date(ts).toLocaleDateString('pt-BR', {day:'2-digit', month:'2-digit'});
const fdateY = ts => new Date(ts).toLocaleDateString('pt-BR');
const sameMonth = (ts, d) => { const x = new Date(ts); return x.getMonth() === d.getMonth() && x.getFullYear() === d.getFullYear(); };
const initials = n => n.split(' ').filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase();

/* Ícones ---------------------------------------------------------------- */
const IC = {
  plus:'<path d="M12 5v14M5 12h14"/>',
  minus:'<path d="M5 12h14"/>',
  back:'<path d="M15 18l-6-6 6-6"/>',
  chev:'<path d="M9 18l6-6-6-6"/>',

  check:'<path d="M20 6 9 17l-5-5"/>',
  home:'<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5.5v-6h-5v6H4a1 1 0 0 1-1-1z"/>',
  list:'<path d="M9 6h12M9 12h12M9 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/>',
  tag:'<path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.5"/>',
  sliders:'<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/>',
  user:'<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
  chat:'<path d="M21 11.5a8.5 8.5 0 0 1-12.6 7.4L3 20.5l1.6-5.2A8.5 8.5 0 1 1 21 11.5z"/>',
  copy:'<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>',
  trash:'<path d="M3 6h18M8 6V4h8v2M6 6l1 15h10l1-15"/>',
  lock:'<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
  out:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>',
};
const ic = (n, s = 22) => `<svg class="ic" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true">${IC[n]}</svg>`;

/* Display de 7 segmentos, como o de um controlador de temperatura ------- */
const SEG = {0:'abcdef',1:'bc',2:'abged',3:'abgcd',4:'fgbc',5:'afgcd',6:'afgedc',7:'abc',8:'abcdefg',9:'abcdfg','-':'g','°':'abfg','C':'adef',' ':''};
const SW = 36, SH = 64, ADV = 48;
const hs = (x1, x2, y) => `${x1},${y} ${x1+3},${y-3} ${x2-3},${y-3} ${x2},${y} ${x2-3},${y+3} ${x1+3},${y+3}`;
const vs = (x, y1, y2) => `${x},${y1} ${x+3},${y1+3} ${x+3},${y2-3} ${x},${y2} ${x-3},${y2-3} ${x-3},${y1+3}`;
const GEO = {a:hs(4,32,3), g:hs(4,32,32), d:hs(4,32,61), f:vs(3,4,31), b:vs(33,4,31), e:vs(3,33,60), c:vs(33,33,60)};
function seg7(str){
  const cells = [];
  for (const ch of str){
    if ((ch === ',' || ch === '.') && cells.length){ cells[cells.length - 1].dp = true; continue; }
    cells.push({ch, dp:false});
  }
  let g = '';
  cells.forEach((c, i) => {
    const on = SEG[c.ch] ?? '';
    g += `<g transform="translate(${i * ADV + 10},0) skewX(-7)">`;
    for (const k of 'abcdefg') g += `<polygon points="${GEO[k]}" class="${on.includes(k) ? 's-on' : 's-off'}"/>`;
    g += `<circle cx="${SW + 5}" cy="${SH - 3}" r="3.2" class="${c.dp ? 's-on' : 's-off'}"/></g>`;
  });
  return `<svg class="seg" viewBox="0 0 ${cells.length * ADV + 10} ${SH}" preserveAspectRatio="xMinYMax meet" aria-hidden="true">${g}</svg>`;
}

/* Dados de exemplo (tudo fictício) ------------------------------------- */
const PECAS = ['Compressor 1/4 HP R-134a','Compressor 1/5 HP R-600a','Filtro secador','Gás R-134a (kg)','Gás R-600a (lata)','Gás R-410A (kg)','Termostato','Relé de partida','Protetor térmico','Capacitor 35 µF','Resistência de degelo','Timer de degelo','Ventilador do evaporador','Motor do ventilador do condensador','Sensor de temperatura','Placa eletrônica','Borracha da porta (gaxeta)','Controlador digital de temperatura'];
const EQUIP = ['Geladeira','Freezer','Câmara fria','Balcão refrigerado','Ar-condicionado','Bebedouro','Máquina de lavar','Micro-ondas','Outro'];

function seed(){
  const now = Date.now();
  const pecas = PECAS.map((nome, k) => ({id:'p' + (k + 1), nome}));
  const nomeP = id => pecas.find(p => p.id === id).nome;
  const cot = (f, custo, em, prazo, por) => ({fornecedorId:f, custoUnit:custo, em, prazo, por});
  const item = (pid, qtd, c = null) => ({pecaId:pid, nome:nomeP(pid), qtd, cotacao:c});
  const params = {
    versao:3, desde:now - 3 * D, por:'u1',
    valorHora:8000, valorKm:150, taxaFixa:0,
    margemPecas:30, margemServico:30, imposto:6,
    validadeDias:5, pagamento:'Pix, dinheiro ou cartão',
    seguranca:[{ateDias:1, pct:5}, {ateDias:3, pct:8}, {ateDias:7, pct:12}],
  };
  const s = {
    v:1, session:null, draft:null, seq:143,
    users:[
      {id:'u1', nome:'Dono da Dexter', email:'dono@dexter.teste', papel:'admin', status:'ativo'},
      {id:'u2', nome:'João Pereira', email:'joao@dexter.teste', papel:'tecnico', status:'ativo'},
      {id:'u3', nome:'Marcos Lima', email:'marcos@dexter.teste', papel:'tecnico', status:'ativo'},
    ],
    fornecedores:[
      {id:'f1', nome:'Polo Frio Peças', whats:'(11) 98888-1020'},
      {id:'f2', nome:'Casa do Compressor', whats:'(11) 97777-3344'},
      {id:'f3', nome:'Gelopeças Distribuidora', whats:'(11) 96666-5577'},
      {id:'f4', nome:'Refrigás Atacado', whats:'(11) 95555-7788'},
    ],
    pecas, params,
    paramsHist:[{versao:2, desde:now - 41 * D, por:'u1'}, {versao:1, desde:now - 88 * D, por:'u1'}],
    historico:[
      ['p3','f1',1800,now - 20 * H,0,'u3'], ['p1','f2',52000,now - 2 * D,1,'u1'],
      ['p4','f4',8500,now - 4 * D,0,'u2'],  ['p8','f3',3200,now - 9 * D,0,'u2'],
      ['p13','f3',14500,now - 5 * H,1,'u1'], ['p15','f1',3800,now - 5 * H,0,'u1'],
      ['p11','f1',6400,now - 26 * H,0,'u2'], ['p12','f3',7200,now - 26 * H,1,'u2'],
    ].map(([pecaId, f, c, em, prazo, por]) => ({pecaId, ...cot(f, c, em, prazo, por)})),
    orcs:[],
  };
  const o = x => ({modelo:'', defeito:'', fechado:null, status:'aberto', ...x});
  const list = [
    o({id:142, cliente:{nome:'Ana Souza', whats:'(11) 91234-5678', bairro:'Vila Mariana'}, equipamento:'Geladeira', modelo:'Consul CRM38', defeito:'Não gela embaixo. O motor arma e desarma.', itens:[item('p1',1), item('p3',1), item('p4',1)], horas:3, km:18, criadoPor:'u2', criadoEm:now - 25 * M}),
    o({id:141, cliente:{nome:'Bar do Zé', whats:'(11) 93456-7788', bairro:'Centro'}, equipamento:'Câmara fria', defeito:'Não passa de -10 °C. Ventilador do evaporador fazendo barulho.', itens:[item('p13',1,cot('f3',14500,now - 5 * H,1,'u1')), item('p15',1,cot('f1',3800,now - 5 * H,0,'u1'))], horas:4, km:9, criadoPor:'u2', criadoEm:now - 6 * H}),
    o({id:140, cliente:{nome:'Padaria Trigo Bom', whats:'(11) 94567-1122', bairro:'Mooca'}, equipamento:'Balcão refrigerado', defeito:'Forma gelo no evaporador e para de gelar.', itens:[item('p11',1,cot('f1',6400,now - 26 * H,0,'u2')), item('p12',1,cot('f3',7200,now - 26 * H,1,'u2'))], horas:2.5, km:12, criadoPor:'u2', criadoEm:now - 27 * H, status:'enviado', _env:now - 24 * H}),
    o({id:139, cliente:{nome:'Lúcia Martins', whats:'(11) 95678-3344', bairro:'Ipiranga'}, equipamento:'Freezer', modelo:'Electrolux H300', defeito:'Desliga sozinho depois de alguns minutos.', itens:[item('p8',1,cot('f3',3200,now - 9 * D - 2 * H,0,'u2')), item('p9',1,cot('f3',2900,now - 9 * D - 2 * H,0,'u2'))], horas:1.5, km:6, criadoPor:'u2', criadoEm:now - 9 * D - 3 * H, status:'aprovado', _env:now - 9 * D, decididoEm:now - 8 * D}),
    o({id:138, cliente:{nome:'Pedro Alves', whats:'(11) 96789-5566', bairro:'Santana'}, equipamento:'Ar-condicionado', modelo:'Split 12.000 BTUs', defeito:'Não gela. Suspeita de vazamento.', itens:[item('p6',2,cot('f4',9500,now - 12 * D - 2 * H,0,'u3'))], horas:3, km:22, criadoPor:'u3', criadoEm:now - 12 * D - 3 * H, status:'recusado', _env:now - 12 * D, decididoEm:now - 11 * D}),
    o({id:137, cliente:{nome:'Restaurante Sabor da Serra', whats:'(11) 97890-7788', bairro:'Pinheiros'}, equipamento:'Câmara fria', defeito:'O controlador não liga.', itens:[item('p18',1,cot('f2',21000,now - 8 * D - 3 * H,2,'u1'))], horas:2, km:15, criadoPor:'u2', criadoEm:now - 8 * D - 4 * H, status:'enviado', _env:now - 8 * D}),
  ];
  for (const x of list){ if (x._env) fechar(x, params, x._env); delete x._env; }
  s.orcs = list;
  return s;
}

function load(){ try { const s = JSON.parse(localStorage.getItem(KEY)); return s && s.v === 1 ? s : null; } catch { return null; } }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {} }

let state = load() || seed();
const ui = {lastTop:'inicio', q:'', err:null, boot:null, focus:null, sel:null, paneKey:null};
const VERSAO = 'protótipo 0.5';
const erros = [];
let ultimoAvisoErro = 0;
function registrarErro(msg, linha){
  erros.push({msg:String(msg).slice(0, 200), linha, em:Date.now()});
  if (erros.length > 5) erros.shift();
  if (Date.now() - ultimoAvisoErro > 10000){ ultimoAvisoErro = Date.now(); toast('Algo deu errado nesta tela. Se puder, use Reportar, no topo.'); }
}
window.addEventListener('error', e => registrarErro(e.message, e.lineno));
window.addEventListener('unhandledrejection', e => registrarErro(e.reason?.message || e.reason, null));
const THEME_KEY = 'dexter-tema';
let tema = 'system';
try { tema = localStorage.getItem(THEME_KEY) || 'system'; } catch {}
function applyTheme(t){
  if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
  else delete document.documentElement.dataset.theme;
}
applyTheme(tema);

const me = () => state.users.find(u => u.id === state.session?.userId);
const user = id => state.users.find(u => u.id === id);
const first = u => u ? u.nome.split(' ')[0] : 'alguém';
const forn = id => state.fornecedores.find(f => f.id === id);
const findOrc = id => state.orcs.find(o => o.id === id);

/* Motor de precificação (provisório: a fórmula real vem do dono) -------- */
function precificar(o, p = state.params, ref = Date.now()){
  const fator = m => (1 + m / 100) / (1 - p.imposto / 100);
  const linhas = o.itens.map(it => {
    const c = it.cotacao;
    if (!c) return {...it, estado:'sem'};
    const idade = (ref - c.em) / D;
    const faixa = p.seguranca.find(f => idade <= f.ateDias);
    if (!faixa) return {...it, estado:'vencida', idade};
    const custo = c.custoUnit * it.qtd;
    const custoSeg = Math.round(custo * (1 + faixa.pct / 100));
    const preco = Math.round(custoSeg * fator(p.margemPecas));
    return {...it, estado:'ok', idade, pct:faixa.pct, custo, custoSeg, preco};
  });
  const pend = linhas.filter(l => l.estado !== 'ok').length;
  const pecas = linhas.reduce((s, l) => s + (l.preco || 0), 0);
  const maoCusto = Math.round(o.horas * p.valorHora) + p.taxaFixa;
  const deslCusto = Math.round(o.km * p.valorKm);
  const mao = Math.round(maoCusto * fator(p.margemServico));
  const desl = Math.round(deslCusto * fator(p.margemServico));
  const prazoExec = Math.max(0, ...linhas.map(l => l.cotacao?.prazo ?? 0)) + 1;
  return {linhas, pend, pecas, maoCusto, deslCusto, mao, desl, total:pecas + mao + desl, pronto:pend === 0, prazoExec};
}
// Congela valores e parâmetros no envio: mudar a margem depois não altera este orçamento.
function fechar(o, p, ref){
  const r = precificar(o, p, ref);
  o.fechado = {...r, em:ref, validadeAte:ref + p.validadeDias * D, params:JSON.parse(JSON.stringify(p))};
}
function statusOf(o){
  if (o.status === 'aberto') return precificar(o).pronto ? 'pronto' : 'aguardando';
  if (o.status === 'enviado' && Date.now() > o.fechado.validadeAte) return 'vencido';
  return o.status;
}
function refPreco(pecaId){
  if (!pecaId) return null;
  const h = state.historico.filter(x => x.pecaId === pecaId).sort((a, b) => b.em - a.em)[0];
  if (!h) return null;
  const idade = (Date.now() - h.em) / D;
  const faixa = state.params.seguranca.find(f => idade <= f.ateDias);
  return {...h, idade, valido:!!faixa, pct:faixa?.pct};
}

const ST = {
  aguardando:['Em cotação','st-aguardando'], pronto:['Pronto','st-pronto'],
  enviado:['Enviado','st-enviado'], vencido:['Vencido','st-vencido'],
  aprovado:['Aprovado','st-aprovado'], recusado:['Recusado','st-recusado'],
};
const chip = (st, label) => `<span class="chip ${ST[st][1]}">${label || ST[st][0]}</span>`;

/* Pedaços de tela ------------------------------------------------------ */
const wordmark = () => `<div class="wordmark">Dexter<small>Soluções em Refrigeração</small></div>`;
const strip = () => `<div class="strip"><span class="strip-t">Protótipo: dados fictícios, nada é enviado.</span>
  <a class="strip-b" href="#/ajuda" aria-keyshortcuts="?"><span class="k" aria-hidden="true">?</span>Ajuda</a>
  <button class="strip-b" type="button" data-act="reportar" aria-keyshortcuts="!"><span class="k" aria-hidden="true">!</span>Reportar</button></div>`;
const backTo = (href, label = 'Voltar') => `<a class="iconbtn" href="${href}" aria-label="${label}">${ic('back')}</a>`;
const actions = inner => inner ? `<div class="actions"><div class="in">${inner}</div></div>` : '';

function valorOf(o){
  if (o.fechado) return o.fechado.total;
  const r = precificar(o);
  return r.pronto ? r.total : null;
}
function orcRow(o){
  const st = statusOf(o), v = valorOf(o);
  const quando = o.status === 'aprovado' || o.status === 'recusado' ? `${o.status} ${rel(o.decididoEm)}`
    : o.fechado ? `enviado ${rel(o.fechado.em)}` : `criado ${rel(o.criadoEm)}`;
  return `<a class="card" href="#/orcamento/${o.id}"${ui.sel === o.id ? ' aria-current="true"' : ''}>
    <span class="card-top"><span>${esc(o.cliente.nome)}</span><span class="num${v == null ? ' faint' : ''}">${v != null ? brl(v) : 'sem preço'}</span></span>
    <span class="card-body trunc">${esc(o.equipamento)}, nº ${pad(o.id)}</span>
    <span class="card-bot">${chip(st)}<span class="faint">${quando}</span></span></a>`;
}

function tabbar(cur, sub){

/* Início ---------------------------------------------------------------- */
function viewHome(){
  const u = me(), adm = u.papel === 'admin';
  const base = adm ? state.orcs : state.orcs.filter(o => o.criadoPor === u.id);
  const by = s => base.filter(o => statusOf(o) === s);
  const prontos = by('pronto'), aguard = by('aguardando'), env = by('enviado'), venc = by('vencido');
  const dia = cap(new Date().toLocaleDateString('pt-BR', {weekday:'long', day:'numeric', month:'long'}));
  let h = `<header class="top"><h1>Olá, ${esc(first(u))}<span class="sub">${dia}</span></h1></header>`;
  if (adm){
    const agora = new Date();
    const ap = state.orcs.filter(o => o.status === 'aprovado' && o.decididoEm && sameMonth(o.decididoEm, agora));
    const soma = ap.reduce((s, o) => s + o.fechado.total, 0);
    const mes = agora.toLocaleDateString('pt-BR', {month:'long'});
    const kv = (href, k, v) => href
      ? `<a class="kv" href="${href}"><span class="k">${k}</span><span class="dots"></span><span class="v num">${v}</span></a>`
      : `<div class="kv"><span class="k">${k}</span><span class="dots"></span><span class="v num">${v}</span></div>`;
    h += `<section><div class="sec-h"><h2>Resumo</h2></div><div class="box">
      ${kv('#/cotacoes', 'Esperando preço de peça', aguard.length)}
      ${kv('#/orcamentos/pronto', 'Prontos para enviar', prontos.length)}
      ${kv('#/orcamentos/enviado', 'Aguardando o cliente', env.length)}
      ${kv('', `Aprovados em ${mes}`, brl(soma))}
    </div></section>`;
  }
  const sec = (t, list, hint) => list.length ? `<section class="sec"><div class="sec-h"><h2>${t}</h2>${hint ? `<p>${hint}</p>` : ''}</div><div class="cards">${list.map(orcRow).join('')}</div></section>` : '';
  h += sec('Prontos para enviar', prontos, 'envie logo');
  h += sec('Esperando preço de peça', aguard);
  h += sec('Com o cliente', [...env, ...venc]);
  if (!prontos.length && !aguard.length && !env.length && !venc.length)
    h += `<div class="empty"><p class="muted">Nenhum orçamento em andamento.</p><a class="btn btn-primary" href="#/novo">${ic('plus', 20)}Novo orçamento</a></div>`;
  return `<main class="screen">${h}</main>`;
}

/* Cotações (fila compartilhada) ---------------------------------------- */
function viewCotacoes(){
  const fila = state.orcs.filter(o => statusOf(o) === 'aguardando').sort((a, b) => a.criadoEm - b.criadoEm);
  const cards = fila.map(o => {
    const pend = precificar(o).pend, n = o.itens.length;
    return `<a class="card" href="#/orcamento/${o.id}"${ui.sel === o.id ? ' aria-current="true"' : ''}>
      <span class="card-top"><span>${esc(o.cliente.nome)}</span><span class="faint">${pend}/${n} sem preço</span></span>
      <span class="card-body trunc">${esc(o.equipamento)}, nº ${pad(o.id)}</span>
      <span class="card-bot">${chip('aguardando')}<span class="faint">${rel(o.criadoEm)}, ${esc(first(user(o.criadoPor)))}</span></span></a>`;
  }).join('');
  const maxDias = state.params.seguranca.at(-1).ateDias;
  const hist = [...state.historico].sort((a, b) => b.em - a.em).slice(0, 8).map(h => {
    const ok = (Date.now() - h.em) / D <= maxDias;
    const nome = state.pecas.find(p => p.id === h.pecaId)?.nome || 'Peça';
    return `<div class="row${ok ? '' : ' is-old'}"><span class="main"><span class="t trunc">${esc(nome)}</span><span class="s">${esc(forn(h.fornecedorId)?.nome)}, ${rel(h.em)}${ok ? '' : ', vencido'}</span></span><span class="end num">${brl(h.custoUnit)}</span></div>`;
  }).join('');
  return `<main class="screen">
    <header class="top"><h1>Cotações<span class="sub">Orçamentos esperando preço de peça. Quem pegar primeiro, cota.</span></h1></header>
    ${fila.length ? `<div class="cards">${cards}</div>` : `<p class="info">Nenhum orçamento esperando preço. Os novos aparecem aqui.</p>`}
    <section class="sec"><div class="sec-h"><h2>Preços recentes</h2></div>
      <p class="faint">Servem de referência por até ${maxDias} dias. Depois disso, é preciso cotar de novo.</p>
      <div class="group">${hist}</div></section>
  </main>`;
}

/* Lista de orçamentos -------------------------------------------------- */
const FILTROS = [['todos','Todos'], ['aguardando','Em cotação'], ['pronto','Prontos'], ['enviado','Enviados'], ['vencido','Vencidos'], ['aprovado','Aprovados'], ['recusado','Recusados']];
function olist(f){
  const u = me(), q = norm(ui.q);
  let list = u.papel === 'admin' ? state.orcs : state.orcs.filter(o => o.criadoPor === u.id);
  if (f !== 'todos') list = list.filter(o => statusOf(o) === f);
  if (q) list = list.filter(o => norm(o.cliente.nome).includes(q) || pad(o.id).includes(q));
  list = [...list].sort((a, b) => b.id - a.id);
  return list.length ? `<div class="cards">${list.map(orcRow).join('')}</div>` : `<p class="empty-line">Nenhum orçamento ${q ? 'com essa busca' : 'nessa situação'}.</p>`;
}
function viewOrcamentos(f){

}

/* Novo orçamento (3 passos) -------------------------------------------- */
const novoDraft = () => ({step:1, cliente:{nome:'', whats:'', bairro:''}, equipamento:'', modelo:'', defeito:'', itens:[], horas:2, km:'10', busca:''});
function resultsHTML(){
  const d = state.draft, q = norm(d.busca);
  if (!q) return '';
  const list = state.pecas.filter(p => norm(p.nome).includes(q)).slice(0, 6);
  const exato = list.some(p => norm(p.nome) === q);
  return `<div class="group results">${list.map(p => `<button type="button" class="row" data-act="add-peca" data-p="${p.id}"><span class="main"><span class="t">${esc(p.nome)}</span></span>${ic('plus', 20)}</button>`).join('')}
    ${exato ? '' : `<button type="button" class="row" data-act="add-avulsa"><span class="main"><span class="t">Adicionar “${esc(d.busca.trim())}”</span><span class="s">Peça fora da lista</span></span>${ic('plus', 20)}</button>`}</div>`;
}
function svcSum(){
  const d = state.draft;
  const r = precificar({itens:[], horas:d.horas, km:num(d.km)});
  return `<div class="row"><span class="main"><span class="t">Mão de obra</span></span><span class="end num">${brl(r.mao)}</span></div>
    <div class="row"><span class="main"><span class="t">Deslocamento</span></span><span class="end num">${brl(r.desl)}</span></div>
    <div class="row"><span class="main"><span class="t">Peças</span></span><span class="end faint">depois da cotação</span></div>`;
}
function viewNovo(){
  const d = state.draft || (state.draft = novoDraft());
  const step = d.step;
  const titles = ['Cliente', 'Equipamento e defeito', 'Peças e serviço'];
  const back = step > 1
    ? `<button class="iconbtn" data-act="step" data-to="${step - 1}" aria-label="Voltar ao passo anterior">${ic('back')}</button>`
    : `<button class="iconbtn" data-act="cancelar-novo" aria-label="Cancelar novo orçamento">${ic('x')}</button>`;
  let body = '';
  if (step === 1){
    const bad = ui.err === 'nome';
    body = `
      <div class="field"><label for="n-nome">Nome do cliente</label><input class="input" id="n-nome" data-bind="cliente.nome" value="${esc(d.cliente.nome)}" autocomplete="off"${bad ? ' aria-invalid="true" aria-describedby="n-nome-err"' : ''}>${bad ? '<p class="err" id="n-nome-err">Informe o nome do cliente para continuar.</p>' : ''}</div>
      <div class="field"><label for="n-whats">WhatsApp do cliente</label><input class="input" id="n-whats" data-bind="cliente.whats" value="${esc(d.cliente.whats)}" inputmode="tel" autocomplete="off" placeholder="(11) 90000-0000" aria-describedby="n-whats-h"><p class="xs faint" id="n-whats-h">O orçamento vai para este número.</p></div>
      <div class="field"><label for="n-bairro">Bairro ou endereço</label><input class="input" id="n-bairro" data-bind="cliente.bairro" value="${esc(d.cliente.bairro)}" autocomplete="off"></div>`;
  } else if (step === 2){
    body = `
      <fieldset class="field"><legend>Equipamento</legend><div class="choices">${EQUIP.map(e => `<button type="button" class="choice" data-act="equip" data-v="${e}" aria-pressed="${d.equipamento === e}">${e}</button>`).join('')}</div>${ui.err === 'equip' ? '<p class="err">Escolha o equipamento para continuar.</p>' : ''}</fieldset>
      <div class="field"><label for="n-modelo">Marca e modelo</label><input class="input" id="n-modelo" data-bind="modelo" value="${esc(d.modelo)}" placeholder="Ex.: Consul CRM38" autocomplete="off"></div>
      <div class="field"><label for="n-defeito">Defeito</label><textarea class="input" id="n-defeito" data-bind="defeito" placeholder="O que o cliente relatou e o que você encontrou">${esc(d.defeito)}</textarea></div>`;
  } else {
    const itens = d.itens.map((it, i) => `<div class="row"><span class="main"><span class="t">${esc(it.nome)}</span></span>
      <div class="stepper" role="group" aria-label="Quantidade de ${esc(it.nome)}"><button type="button" data-act="qtd" data-i="${i}" data-d="-1" aria-label="Diminuir">${ic('minus', 18)}</button><output class="num">${it.qtd}</output><button type="button" data-act="qtd" data-i="${i}" data-d="1" aria-label="Aumentar">${ic('plus', 18)}</button></div>
      <button type="button" class="iconbtn" style="margin:0 -8px 0 0" data-act="rm-item" data-i="${i}" aria-label="Remover ${esc(it.nome)}">${ic('trash', 20)}</button></div>`).join('');
    body = `
      <section><div class="sec-h"><h2>Peças</h2></div>
        <label class="search">${ic('search', 20)}<span class="sr">Buscar peça</span><input id="busca" type="search" data-bind="busca" value="${esc(d.busca)}" placeholder="Buscar peça, ex.: filtro" autocomplete="off"></label>
        <div id="resultados">${resultsHTML()}</div>
        ${d.itens.length ? `<div class="group">${itens}</div>` : `<p class="empty-line">Nenhuma peça ainda. Serviço sem peça também pode ser enviado.</p>`}
        <p class="xs faint hint">O preço das peças entra depois, na cotação com os fornecedores.</p>
      </section>
      <section class="sec"><div class="sec-h"><h2>Serviço</h2></div>
        <div class="fields">
          <div class="field"><span class="lbl" id="h-lbl">Horas de serviço</span><div class="stepper" role="group" aria-labelledby="h-lbl"><button type="button" data-act="horas" data-d="-0.5" aria-label="Menos meia hora">${ic('minus', 18)}</button><output class="num">${fmtN(d.horas)} h</output><button type="button" data-act="horas" data-d="0.5" aria-label="Mais meia hora">${ic('plus', 18)}</button></div></div>
          <div class="field"><label for="n-km">Deslocamento</label><div class="affix"><input id="n-km" data-bind="km" inputmode="decimal" value="${esc(d.km)}" autocomplete="off"><span>km</span></div></div>
        </div>
        <div class="group" id="svc-sum" style="margin-top:12px">${svcSum()}</div>
      </section>`;
  }
  const bar = step === 1
    ? `<button class="btn btn-ghost" data-act="cancelar-novo">Cancelar</button><button class="btn btn-primary" data-act="step" data-to="2">Continuar</button>`
    : step === 2
      ? `<button class="btn btn-ghost" data-act="step" data-to="1">Voltar</button><button class="btn btn-primary" data-act="step" data-to="3">Continuar</button>`
      : `<button class="btn btn-ghost" data-act="step" data-to="2">Voltar</button><button class="btn btn-primary" data-act="salvar-novo">${d.itens.length ? 'Salvar e cotar peças' : 'Salvar orçamento'}</button>`;
  return `<main class="screen">
    <header class="top top-sub">${back}<h1>Novo orçamento<span class="sub">Passo ${step} de 3: ${titles[step - 1]}</span></h1></header>
    <div class="steps" aria-hidden="true">${[1, 2, 3].map(k => `<i class="${k <= step ? 'on' : ''}"></i>`).join('')}</div>
    ${body}
  </main>${actions(bar)}`;
}

/* Orçamento (detalhe) -------------------------------------------------- */
function itemRow(o, l, i, editable){
  const q = `${fmtN(l.qtd)} un.`;
  if (l.estado === 'ok'){
    const f = forn(l.cotacao.fornecedorId);
    const inner = `<span class="card-top"><span>${esc(l.nome)}</span><span class="num">${brl(l.preco)}</span></span>
      <span class="card-body">${q} a ${brl(l.cotacao.custoUnit)} na ${esc(f?.nome || 'loja')}</span>
      <span class="card-bot"><span class="chip neutral">+${l.pct}% seg.</span><span class="faint">${rel(l.cotacao.em)}, ${esc(first(user(l.cotacao.por)))}</span></span>`;
    return editable ? `<button class="card" data-act="lancar" data-id="${o.id}" data-i="${i}">${inner}</button>` : `<div class="card">${inner}</div>`;
  }
  const ref = refPreco(l.pecaId), refOk = ref && ref.valido, venc = l.estado === 'vencida';
  const corpo = venc ? `A cotação de ${Math.floor(l.idade)} dias venceu.`
    : refOk ? `Último preço: ${brl(ref.custoUnit)} na ${esc(forn(ref.fornecedorId)?.nome)}, ${rel(ref.em)}.` : 'Sem cotação recente.';
  return `<div class="card">
    <span class="card-top"><span>${esc(l.nome)}</span><span class="faint">${q}</span></span>
    <span class="card-body">${corpo}</span>
    ${editable ? `<span class="card-acts">${refOk ? `<button class="btn btn-ghost btn-sm" data-act="usar-ref" data-id="${o.id}" data-i="${i}">Usar último</button>` : ''}<button class="btn btn-primary btn-sm" data-act="lancar" data-id="${o.id}" data-i="${i}">Lançar custo</button></span>` : ''}
    <span class="card-bot">${venc ? chip('vencido', 'Vencida') : chip('aguardando', 'Sem preço')}</span>
  </div>`;
}
function viewOrc(id){
  const o = findOrc(id);
  if (!o) return viewMsg('Orçamento não encontrado', 'Ele não existe mais neste protótipo.');
  const st = statusOf(o), F = o.fechado, r = F || precificar(o), p = F ? F.params : state.params;
  const editable = o.status === 'aberto';
  const boot = ui.boot === o.id; ui.boot = null;

  let digits, sub, aria;
  if (st === 'aguardando'){
    digits = '----'; aria = 'Preço ao cliente: aguardando cotação';
    sub = `Falta preço em ${r.pend} de ${o.itens.length} ${o.itens.length === 1 ? 'peça' : 'peças'}.`;
  } else {
    digits = segVal(r.total); aria = `Preço ao cliente: ${brl(r.total)}`;
    sub = st === 'pronto' ? `Pronto para enviar. Vale ${p.validadeDias} dias a partir do envio.`
      : st === 'enviado' ? `Enviado em ${fdate(F.em)}. Vale até ${fdate(F.validadeAte)}.`
      : st === 'vencido' ? `Venceu em ${fdate(F.validadeAte)}. Cote de novo antes de reenviar.`
      : st === 'aprovado' ? `Aprovado pelo cliente${o.decididoEm ? ` em ${fdate(o.decididoEm)}` : ''}.`
      : `Recusado pelo cliente${o.decididoEm ? ` em ${fdate(o.decididoEm)}` : ''}.`;
  }
  const contato = [o.cliente.whats, o.cliente.bairro].filter(Boolean).map(esc).join(', ') || 'Sem contato cadastrado';
  const pecasOk = o.itens.length && st !== 'aguardando';
  const kv = (k, v) => `<div class="kv"><span class="k">${k}</span><span class="dots"></span><span class="v num">${v}</span></div>`;
  const calcRows = r.linhas.filter(l => l.estado === 'ok').map(l => `<tr><td>${esc(l.nome)}<span>inclui ${l.pct}% de segurança</span></td><td class="num">${brl(l.custoSeg)}</td><td class="num">${brl(l.preco)}</td></tr>`).join('');

  let bar = '';
  if (st === 'aguardando') bar = `<button class="btn btn-primary" data-act="pedir-cotacao" data-id="${o.id}">${ic('chat', 20)}Pedir cotação no WhatsApp</button>`;
  else if (st === 'pronto') bar = `<button class="btn btn-wa" data-act="enviar" data-id="${o.id}">${ic('chat', 20)}Enviar ao cliente</button>`;
  else if (st === 'enviado') bar = `<button class="btn btn-ghost" data-act="recusar" data-id="${o.id}">Cliente recusou</button><button class="btn btn-primary" data-act="aprovar" data-id="${o.id}">${ic('check', 20)}Cliente aprovou</button>`;
  else if (st === 'vencido') bar = `<button class="btn btn-primary" data-act="recotar" data-id="${o.id}">Cotar de novo</button>`;

  return `<main class="screen">
    <header class="top">${backTo('#/' + ui.lastTop)}<h1>Orçamento nº ${pad(o.id)}<span class="sub">Criado ${rel(o.criadoEm)} por ${esc(first(user(o.criadoPor)))}</span></h1></header>
    <p>${chip(st)}</p>
    <div class="display${boot ? ' boot' : ''}">
      <span class="d-lbl">Preço ao cliente</span>
      <div class="readout" role="img" aria-label="${aria}"><span class="cur" aria-hidden="true">R$</span>${seg7(digits)}</div>
      <p class="d-sub">${sub}</p>
    </div>
    <section class="sec"><div class="sec-h"><h2>Cliente</h2></div><div class="box">
      <p class="strong">${esc(o.cliente.nome)}</p><p class="muted">${contato}</p>
      <p class="strong gap">${esc(o.equipamento)}${o.modelo ? ' ' + esc(o.modelo) : ''}</p>${o.defeito ? `<p class="muted">${esc(o.defeito)}</p>` : ''}
    </div></section>
    <section class="sec"><div class="sec-h"><h2>Peças</h2>${o.itens.length ? `<p>${o.itens.length - r.pend}/${o.itens.length} com preço</p>` : ''}</div>
      ${o.itens.length ? `<div class="cards">${r.linhas.map((l, i) => itemRow(o, l, i, editable)).join('')}</div>${pecasOk ? `<div class="kv total"><span class="k">Total das peças</span><span class="dots"></span><span class="v num">${brl(r.pecas)}</span></div>` : ''}` : '<p class="empty-line">Serviço sem peças.</p>'}
    </section>
    <section class="sec"><div class="sec-h"><h2>Serviço</h2>${editable ? `<button class="link" data-act="editar-servico" data-id="${o.id}">Editar</button>` : ''}</div><div class="box">
      ${kv('Mão de obra', brl(r.mao))}<p class="kv-sub">${fmtN(o.horas)} h × ${brl(p.valorHora)}${p.taxaFixa ? ` + taxa de ${brl(p.taxaFixa)}` : ''}</p>
      ${kv('Deslocamento', brl(r.desl))}<p class="kv-sub">${fmtN(o.km)} km × ${brl(p.valorKm)}</p>
    </div></section>
    <details class="calc-d"><summary>Como o preço foi calculado</summary><div class="calc-in">
      <p class="muted">Versão ${p.versao} dos parâmetros${F ? ', congelada no envio' : ''}. Margem de ${fmtN(p.margemPecas)}% nas peças e ${fmtN(p.margemServico)}% na mão de obra, imposto de ${fmtN(p.imposto)}% sobre a venda.</p>
      <table class="calc"><thead><tr><th scope="col">Linha</th><th scope="col">Custo</th><th scope="col">Preço</th></tr></thead><tbody>

function updateSim(){
  const f = document.getElementById('pform');
  if (!f) return;
  const E = f.elements;
  const custo = parseMoney(document.getElementById('sim-custo').value) || 0;
  const dias = +document.getElementById('sim-idade').value;
  const k = Math.max(0, state.params.seguranca.findIndex(x => dias <= x.ateDias));
  const pctS = parseNum(E['seg' + k].value) || 0;
  const m = parseNum(E.margemPecas.value) || 0;
  const t = Math.min(99, parseNum(E.imposto.value) || 0);
  const cs = Math.round(custo * (1 + pctS / 100)), cm = Math.round(cs * (1 + m / 100)), pr = Math.round(cm / (1 - t / 100));
  document.getElementById('sim-seg').innerHTML = seg7(segVal(pr));
  document.getElementById('sim-ro').setAttribute('aria-label', `Preço ao cliente: ${brl(pr)}`);
  document.getElementById('sim-tab').innerHTML = `<tbody>
    <tr><td>Custo cotado</td><td class="num">${brl(custo)}</td></tr>
    <tr><td>Com ${fmtN(pctS)}% de segurança</td><td class="num">${brl(cs)}</td></tr>
    <tr><td>Com ${fmtN(m)}% de margem</td><td class="num">${brl(cm)}</td></tr>
    <tr><td><b>Com ${fmtN(t)}% de imposto</b></td><td class="num"><b>${brl(pr)}</b></td></tr></tbody>`;
}

      <div class="field"><label for="s-km">Deslocamento</label><div class="affix"><input id="s-km" name="km" inputmode="decimal" value="${fmtN(o.km)}" autocomplete="off"><span>km</span></div></div>
      <p class="err" id="s-err" role="alert"></p>
      <button class="btn btn-primary btn-block" type="submit">Salvar serviço</button>
    </form>`;
}
function sheetUser(){
  return `<h2 id="sheet-title" tabindex="-1">Adicionar pessoa</h2>
    <p class="small muted">A pessoa recebe um convite por e-mail e cria a própria senha.</p>
    <form data-form="user" novalidate>
      <div class="field"><label for="u-nome">Nome</label><input class="input" id="u-nome" name="nome" autocomplete="off" data-autofocus></div>
      <div class="field"><label for="u-email">E-mail</label><input class="input" id="u-email" name="email" type="email" inputmode="email" autocomplete="off"></div>
      <fieldset class="field"><legend>Papel</legend><div class="choices">
        <label class="choice-r"><input type="radio" name="papel" value="tecnico" checked><span>Técnico</span></label>
        <label class="choice-r"><input type="radio" name="papel" value="admin"><span>Administrador</span></label></div>
        <p class="xs faint">O técnico cria e cota orçamentos. O administrador também muda preços, equipe e fornecedores.</p></fieldset>
      <p class="err" id="u-err" role="alert"></p>
      <button class="btn btn-primary btn-block" type="submit">Enviar convite</button>
    </form>`;
}
function sheetForn(){
  return `<h2 id="sheet-title" tabindex="-1">Adicionar fornecedor</h2>
    <form data-form="forn" novalidate style="margin-top:12px">
      <div class="field"><label for="fo-nome">Nome</label><input class="input" id="fo-nome" name="nome" autocomplete="off" data-autofocus></div>
      <div class="field"><label for="fo-whats">WhatsApp</label><input class="input" id="fo-whats" name="whats" inputmode="tel" placeholder="(11) 90000-0000" autocomplete="off"></div>
      <p class="err" id="fo-err" role="alert"></p>
      <button class="btn btn-primary btn-block" type="submit">Salvar fornecedor</button>
    </form>`;
}

let lastFocus = null;
function openSheet(html){
  lastFocus = document.activeElement;
  const s = document.getElementById('sheet');
  s.innerHTML = `<div class="sheet-head"><span class="grab" aria-hidden="true"></span><button class="iconbtn sheet-x" type="button" data-act="sheet-close" aria-label="Fechar">${ic('x')}</button></div>${html}`;
  s.scrollTop = 0;
  s.classList.add('open');
  document.getElementById('scrim').classList.add('open');
  document.body.classList.add('locked');
  requestAnimationFrame(() => (s.querySelector('[data-autofocus]') || s.querySelector('h2'))?.focus({preventScroll:true}));
}
function closeSheet(){
  const s = document.getElementById('sheet');
  if (!s.classList.contains('open')) return;
  s.classList.remove('open');
  document.getElementById('scrim').classList.remove('open');
  document.body.classList.remove('locked');
  if (lastFocus && document.contains(lastFocus)) lastFocus.focus({preventScroll:true});
}

let tt;
function toast(m){
  const el = document.getElementById('toast');
  el.textContent = m;
  el.classList.add('show');
  clearTimeout(tt);
  tt = setTimeout(() => el.classList.remove('show'), 3400);
}
function copyText(t){
  const fallback = () => {
    const ta = document.createElement('textarea');
    ta.value = t; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch {}
    ta.remove();
    toast(ok ? 'Mensagem copiada.' : 'Não deu para copiar. Selecione o texto e copie.');
  };
  if (navigator.clipboard?.writeText) navigator.clipboard.writeText(t).then(() => toast('Mensagem copiada.'), fallback);
  else fallback();
}

/* Roteamento ------------------------------------------------------------ */
const WIDE = matchMedia('(min-width: 1200px)');
const LIST_ROUTES = ['inicio', 'cotacoes', 'orcamentos'];
const PANE_T = {inicio:'Início', cotacoes:'Cotações', orcamentos:'Orçamentos'};
const asDiv = h => h.replaceAll('<main class="screen">', '<div class="screen">').replaceAll('</main>', '</div>');
function panesHTML(key, id){
  const [k, f] = key.split('/');
  const list = k === 'cotacoes' ? viewCotacoes() : k === 'orcamentos' ? viewOrcamentos(FILTROS.some(x => x[0] === f) ? f : 'todos') : viewHome();
  const detail = id ? viewOrc(id) : `<div class="screen"><div class="pane-empty"><p class="faint">Escolha um orçamento na lista para ver aqui.</p><p class="faint"><span class="key">[j/k]</span> navega pela lista e <span class="key">[n]</span> cria um novo.</p></div></div>`;
  return `<main class="panes">
    <section class="pane pane-list" aria-label="${PANE_T[k]}"><span class="pane-t" aria-hidden="true">${PANE_T[k]}</span><div class="pane-scroll">${asDiv(list)}</div><span class="pane-k" aria-hidden="true">[j/k] navegar &nbsp; [n] novo</span></section>
    <section class="pane pane-detail" aria-label="Detalhe do orçamento"><span class="pane-t" aria-hidden="true">Detalhe</span><div class="pane-scroll">${asDiv(detail)}</div></section>
  </main>`;
}
function paint(html, {bare = false, cur = null, sub = false} = {}){
  const app = document.getElementById('app');
  app.className = bare ? '' : 'with-rail';
  app.innerHTML = bare ? html : strip() + html + tabbar(cur, sub);
}
function render(){
  const [r = '', a] = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
  const u = me();
  if (!u){
    if (r !== 'login'){ location.replace('#/login'); return; }
    paint(viewLogin(), {bare:true});
    return;
  }
  if (r === '' || r === 'login'){ location.replace('#/inicio'); return; }
  const adm = u.papel === 'admin';
  if (WIDE.matches && (r === 'orcamento' || LIST_ROUTES.includes(r))){
    if (r !== 'orcamento') ui.lastTop = r === 'orcamentos' && a ? `orcamentos/${a}` : r;
    const key = LIST_ROUTES.includes(ui.lastTop.split('/')[0]) ? ui.lastTop : 'inicio';
    const prevScroll = document.querySelector('.pane-list .pane-scroll')?.scrollTop ?? 0, prevKey = ui.paneKey;
    ui.sel = r === 'orcamento' ? +a : null;
    ui.paneKey = key;
    paint(panesHTML(key, ui.sel), {cur:key.split('/')[0], sub:false});
    const ls = document.querySelector('.pane-list .pane-scroll');
    if (ls && prevKey === key) ls.scrollTop = prevScroll;
    document.querySelector('.pane-list .card[aria-current="true"]')?.scrollIntoView({block:'nearest'});
    if (ui.focus){ document.getElementById(ui.focus)?.focus(); ui.focus = null; }
    return;
  }
  ui.sel = null; ui.paneKey = null;
  let html, cur = null, sub = false, after = null;
  switch (r){
    case 'inicio': html = viewHome(); cur = 'inicio'; break;
    case 'cotacoes': html = viewCotacoes(); cur = 'cotacoes'; break;
    case 'orcamentos': html = viewOrcamentos(FILTROS.some(f => f[0] === a) ? a : 'todos'); cur = 'orcamentos'; break;
    case 'conta': html = viewConta(); cur = 'conta'; break;
    case 'novo': html = viewNovo(); sub = true; break;
    case 'orcamento': html = viewOrc(+a); sub = true; cur = ui.lastTop.split('/')[0]; break;
    case 'ajustes':
      cur = 'ajustes';
      if (!adm){ html = viewMsg('Área do administrador', 'Esta tela é só para quem administra a Dexter. Para mudar preços, equipe ou fornecedores, fale com o responsável.'); sub = true; break; }
      if (!a) html = viewAjustes();
      else { sub = true;
        if (a === 'precos'){ html = viewPrecos(); after = updateSim; }
        else if (a === 'equipe') html = viewEquipe();
        else if (a === 'fornecedores') html = viewFornecedores();
        else html = viewMsg('Página não encontrada', 'Volte ao início e tente de novo.');
      }
      break;
    case 'ajuda': html = viewAjuda(); sub = true; break;
    default: html = viewMsg('Página não encontrada', 'Volte ao início e tente de novo.'); sub = true;
  }
  if (!sub && cur) ui.lastTop = cur === 'orcamentos' && a ? `orcamentos/${a}` : cur;
  paint(html, {cur, sub});
  if (after) after();
  if (ui.focus){ document.getElementById(ui.focus)?.focus(); ui.focus = null; }
}

/* Ações ----------------------------------------------------------------- */
function afterCost(o, msg){
  const pronto = statusOf(o) === 'pronto';
  if (pronto) ui.boot = o.id;
  save(); closeSheet(); render();
  toast(pronto ? 'Todas as peças têm preço. Pronto para enviar.' : msg);
}
function setDraft(path, v){
  const d = state.draft; if (!d) return;
  const ks = path.split('.'); let t = d;
  while (ks.length > 1) t = t[ks.shift()];
  t[ks[0]] = v;
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act, o = el.dataset.id ? findOrc(+el.dataset.id) : null, i = +el.dataset.i;
  const d = state.draft;
  switch (act){
    case 'sheet-close': closeSheet(); break;
    case 'theme':
      tema = el.dataset.v;
      try { localStorage.setItem(THEME_KEY, tema); } catch {}
      applyTheme(tema); render();
      break;
    case 'demo': {
      const f = document.querySelector('form[data-form="login"]');
      f.elements.email.value = el.dataset.role === 'admin' ? 'dono@dexter.teste' : 'joao@dexter.teste';
      f.elements.senha.value = '1234';
      f.querySelector('[type="submit"]').focus();
      break;
    }
    case 'logout': state.session = null; save(); location.hash = '#/login'; break;
    case 'reset': {
      if (!confirm('Apagar o que foi feito no protótipo e voltar aos dados de exemplo?')) break;
      const uid = state.session?.userId;
      state = seed(); state.session = uid ? {userId:uid} : null; save();
      location.hash = '#/inicio'; render(); toast('Dados de exemplo restaurados.');
      break;
    }
    case 'lancar': openSheet(sheetLancar(o, i)); updateCustoPreview(); break;
    case 'usar-ref': {
      const ref = refPreco(o.itens[i].pecaId);
      if (!ref?.valido){ toast('Esse preço já venceu. Peça uma nova cotação.'); break; }
      o.itens[i].cotacao = {fornecedorId:ref.fornecedorId, custoUnit:ref.custoUnit, em:ref.em, prazo:ref.prazo ?? 1, por:ref.por};
      afterCost(o, `Último preço usado, com ${ref.pct}% de segurança.`);
      break;
    }
    case 'pedir-cotacao': openSheet(sheetPedir(o)); break;
    case 'copy': copyText(document.getElementById(el.dataset.src).textContent); break;
    case 'forn-msg': toast(`No app, abre o WhatsApp da ${forn(el.dataset.f).nome} com a mensagem pronta.`); break;
    case 'enviar': openSheet(sheetEnviar(o)); break;
    case 'confirmar-envio':
      fechar(o, state.params, Date.now()); o.status = 'enviado';
      save(); closeSheet(); render(); toast(`Orçamento enviado para ${o.cliente.nome}.`);
      break;
    case 'aprovar': case 'recusar':
      o.status = act === 'aprovar' ? 'aprovado' : 'recusado'; o.decididoEm = Date.now();
      save(); render(); toast(act === 'aprovar' ? 'Orçamento marcado como aprovado.' : 'Orçamento marcado como recusado.');
      break;
    case 'recotar':
      o.status = 'aberto'; o.fechado = null;
      save(); render(); toast('Orçamento reaberto. Confira as cotações vencidas.');
      break;
    case 'editar-servico': openSheet(sheetServico(o)); break;
    case 'add-user': openSheet(sheetUser()); break;
    case 'reportar': openSheet(sheetReport()); break;
    case 'add-forn': openSheet(sheetForn()); break;

    /* novo orçamento */
    case 'step': {
      const to = +el.dataset.to;
      if (to > d.step){
        if (d.step === 1 && !d.cliente.nome.trim()){ ui.err = 'nome'; ui.focus = 'n-nome'; render(); break; }
        if (d.step === 2 && !d.equipamento){ ui.err = 'equip'; render(); break; }
      }
      ui.err = null; d.step = to; save(); render(); window.scrollTo(0, 0);
      break;
    }
    case 'cancelar-novo': {
      const tem = d && (d.cliente.nome || d.itens.length || d.defeito);
      if (tem && !confirm('Descartar este orçamento? O que foi preenchido será perdido.')) break;
      state.draft = null; ui.err = null; save(); location.hash = '#/' + ui.lastTop;
      break;
    }
    case 'equip': d.equipamento = el.dataset.v; if (ui.err === 'equip') ui.err = null; save(); render(); break;
    case 'add-peca': {
      const p = state.pecas.find(x => x.id === el.dataset.p);
      const ex = d.itens.find(x => x.pecaId === p.id);
      if (ex) ex.qtd++; else d.itens.push({pecaId:p.id, nome:p.nome, qtd:1});
      d.busca = ''; ui.focus = 'busca'; save(); render();
      break;
    }
    case 'add-avulsa': {
      const nome = d.busca.trim(); if (!nome) break;
      const p = {id:'p' + Date.now(), nome};
      state.pecas.push(p); d.itens.push({pecaId:p.id, nome, qtd:1});
      d.busca = ''; ui.focus = 'busca'; save(); render();
      break;
    }
    case 'qtd': d.itens[i].qtd = Math.max(1, d.itens[i].qtd + +el.dataset.d); save(); render(); break;
    case 'rm-item': d.itens.splice(i, 1); save(); render(); break;
    case 'horas': d.horas = Math.max(0, Math.round((d.horas + +el.dataset.d) * 2) / 2); save(); render(); break;
    case 'salvar-novo': {
      const id = state.seq++;
      const novo = {id, cliente:{...d.cliente}, equipamento:d.equipamento, modelo:d.modelo.trim(), defeito:d.defeito.trim(),
        itens:d.itens.map(x => ({pecaId:x.pecaId, nome:x.nome, qtd:x.qtd, cotacao:null})),
        horas:d.horas, km:num(d.km), criadoPor:me().id, criadoEm:Date.now(), status:'aberto', fechado:null};
      state.orcs.unshift(novo); state.draft = null; save();
      location.hash = `#/orcamento/${id}`;
      toast(novo.itens.length ? `Orçamento nº ${pad(id)} criado. Agora, cote as peças.` : `Orçamento nº ${pad(id)} criado e pronto para enviar.`);
      break;
    }
  }
});

const forms = {
  login(f){
    const email = f.elements.email.value.trim().toLowerCase(), senha = f.elements.senha.value;
    const u = state.users.find(x => x.email === email), err = document.getElementById('l-err');
    if (!u || senha !== '1234'){ err.textContent = 'E-mail ou senha incorretos. Confira e tente de novo.'; return; }
    if (u.status !== 'ativo'){ err.textContent = 'Este acesso ainda não foi ativado. Abra o convite que chegou no seu e-mail.'; return; }
    state.session = {userId:u.id}; save(); location.hash = '#/inicio';
  },
  custo(f){
    const o = findOrc(+f.dataset.id), i = +f.dataset.i, c = parseMoney(f.elements.custo.value);
    if (!(c > 0)){ document.getElementById('c-err').textContent = 'Digite o custo por unidade, por exemplo 85,00.'; f.elements.custo.focus(); return; }
    const cot = {fornecedorId:f.elements.forn.value, custoUnit:c, em:Date.now(), prazo:+(f.querySelector('[name="prazo"]:checked')?.value || 0), por:me().id};
    o.itens[i].cotacao = cot;
    if (o.itens[i].pecaId) state.historico.push({pecaId:o.itens[i].pecaId, ...cot});
    afterCost(o, 'Custo salvo.');
  },
  servico(f){
    const o = findOrc(+f.dataset.id), h = parseNum(f.elements.horas.value), k = parseNum(f.elements.km.value);
    if (!(h >= 0) || !(k >= 0)){ document.getElementById('s-err').textContent = 'Use só números, por exemplo 2,5.'; return; }
    o.horas = h; o.km = k; save(); closeSheet(); render(); toast('Serviço atualizado.');
  },
  params(f){
    const E = f.elements, err = document.getElementById('p-err');
    const v = {
      valorHora:parseMoney(E.valorHora.value), valorKm:parseMoney(E.valorKm.value), taxaFixa:parseMoney(E.taxaFixa.value || '0'),
      margemPecas:parseNum(E.margemPecas.value), margemServico:parseNum(E.margemServico.value), imposto:parseNum(E.imposto.value),
      validadeDias:Math.round(parseNum(E.validadeDias.value)), pagamento:E.pagamento.value.trim(),
    };
    const segs = [0, 1, 2].map(k => parseNum(E['seg' + k].value));
    const bad = Object.entries(v).some(([k, x]) => k !== 'pagamento' && !(x >= 0)) || segs.some(x => !(x >= 0)) || v.imposto >= 100 || v.validadeDias < 1;
    if (bad){ err.textContent = 'Confira os campos: use só números, e o imposto precisa ser menor que 100%.'; err.scrollIntoView({block:'center'}); return; }
    const old = state.params;
    state.paramsHist.unshift({versao:old.versao, desde:old.desde, por:old.por});
    state.params = {...v, seguranca:old.seguranca.map((s, k) => ({...s, pct:segs[k]})), versao:old.versao + 1, desde:Date.now(), por:me().id};
    save(); render(); window.scrollTo(0, 0);
    toast(`Versão ${state.params.versao} salva. Orçamentos já enviados continuam com a versão do envio.`);
  },
  user(f){
    const nome = f.elements.nome.value.trim(), email = f.elements.email.value.trim().toLowerCase(), err = document.getElementById('u-err');
    if (!nome || !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ err.textContent = 'Preencha o nome e um e-mail válido.'; return; }
    if (state.users.some(u => u.email === email)){ err.textContent = 'Já existe alguém com esse e-mail.'; return; }
    state.users.push({id:'u' + Date.now(), nome, email, papel:f.querySelector('[name="papel"]:checked').value, status:'convidado'});
    save(); closeSheet(); render(); toast(`Convite enviado para ${email}.`);
  },
  report(f){
    const tipo = f.querySelector('[name="tipo"]:checked').value, texto = f.elements.texto.value.trim();
    if (texto.length < 5){ document.getElementById('r-err').textContent = 'Escreva pelo menos uma frase curta sobre o que aconteceu.'; f.elements.texto.focus(); return; }
    const ctx = f.elements.ctx.checked ? contexto() : null;
    (state.reports ||= []).push({id:state.reports.length + 1, tipo, texto, contexto:ctx, em:Date.now(), por:me()?.id});
    save();
    const txt = `[${tipo === 'problema' ? 'Problema' : 'Sugestão'}] Dexter Orçamentos\n\n${texto}${ctx ? `\n\n${ctx}` : ''}`;
    openSheet(`<h2 id="sheet-title" tabindex="-1">Relatório registrado</h2>
      <p class="muted">Obrigado! No app de verdade, ele chega direto para quem desenvolve. Neste protótipo, copie o texto e mande pelo WhatsApp.</p>
      <pre class="msg" id="r-final">${esc(txt)}</pre>
      <button class="btn btn-primary btn-block" data-act="copy" data-src="r-final">${ic('copy', 20)}Copiar relatório</button>`);
  },
  forn(f){
    const nome = f.elements.nome.value.trim(), whats = f.elements.whats.value.trim();
    if (!nome){ document.getElementById('fo-err').textContent = 'Preencha o nome do fornecedor.'; return; }
    state.fornecedores.push({id:'f' + Date.now(), nome, whats});
    save(); closeSheet(); render(); toast(`${nome} adicionado.`);
  },
};
document.addEventListener('submit', e => {
  const f = e.target.closest('form[data-form]');
  if (!f) return;
  e.preventDefault();
  forms[f.dataset.form](f);
});

function onEdit(e){
  const t = e.target;
  if (t.dataset.bind){
    setDraft(t.dataset.bind, t.value);
    if (t.id === 'busca') document.getElementById('resultados').innerHTML = resultsHTML();
    if (t.id === 'n-km') document.getElementById('svc-sum').innerHTML = svcSum();
    save();
  }
  if (t.id === 'q'){ ui.q = t.value; document.getElementById('olist').innerHTML = olist(t.dataset.filter); }
  if (t.name === 'tipo' && REPORT_TXT[t.value]){
    document.getElementById('r-label').textContent = REPORT_TXT[t.value][0];
    document.getElementById('r-texto').placeholder = REPORT_TXT[t.value][1];
  }
  if (t.closest('form[data-form="custo"]')) updateCustoPreview();
  if (t.closest('#pform') || (t.id || '').startsWith('sim-')) updateSim();
}
document.addEventListener('input', onEdit);
document.addEventListener('change', onEdit);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){ closeSheet(); return; }
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName || '');
  const sheetOpen = document.getElementById('sheet').classList.contains('open');
  if (typing || sheetOpen || e.metaKey || e.ctrlKey || e.altKey || !me()) return;
  const k = e.key;
  const go = h => { e.preventDefault(); location.hash = h; };
  if (k === 'n' || k === 'N') return go('#/novo');
  if (k === '?') return go('#/ajuda');
  if (k === '!'){ e.preventDefault(); openSheet(sheetReport()); return; }
  if (k === '/'){
    e.preventDefault();
    const q = document.getElementById('q');
    if (q) q.focus(); else { ui.focus = 'q'; location.hash = '#/orcamentos/todos'; }
    return;
  }
  if (/^[1-4]$/.test(k)) return go('#/' + ['inicio', 'cotacoes', 'orcamentos', me().papel === 'admin' ? 'ajustes' : 'conta'][+k - 1]);
  if ((k === 'j' || k === 'k') && document.querySelector('.panes')){
    const cards = [...document.querySelectorAll('.pane-list a.card')];
    if (!cards.length) return;
    const i = cards.findIndex(c => c.getAttribute('aria-current') === 'true');
    go(cards[k === 'j' ? Math.min(cards.length - 1, i + 1) : Math.max(0, i - 1)].getAttribute('href'));
  }
});
WIDE.addEventListener('change', () => render());
window.addEventListener('hashchange', () => { closeSheet(); render(); window.scrollTo(0, 0); });

render();
})();
</script>
